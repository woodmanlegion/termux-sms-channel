<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Channel Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }

  #header {
    background: #111;
    border-bottom: 1px solid #333;
    padding: 10px 16px;
    display: flex;
    gap: 24px;
    align-items: baseline;
    flex-shrink: 0;
    font-size: 13px;
  }
  #header .label { color: #666; }
  #header .value { color: #fff; font-weight: 600; }
  #header .model { color: #7eb8f7; }
  #header .last-seen { color: #888; font-size: 12px; margin-left: auto; }
  #conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #444; display: inline-block; margin-right: 6px;
    transition: background 0.3s;
  }
  #conn-dot.connected { background: #4caf50; }
  #conn-dot.error { background: #f44336; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .entry { display: flex; flex-direction: column; max-width: 75%; gap: 2px; }
  .entry.inbound { align-self: flex-start; }
  .entry.outbound { align-self: flex-end; }
  .entry.system { align-self: center; max-width: 90%; }
  .entry.divider { align-self: stretch; max-width: 100%; }

  .bubble {
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .inbound .bubble { background: #2a2a2a; border-bottom-left-radius: 4px; }
  .outbound .bubble { background: #1565c0; border-bottom-right-radius: 4px; }
  .system .bubble {
    background: #2d2000;
    border: 1px solid #5a4000;
    border-radius: 8px;
    font-size: 12px;
    color: #ffd54f;
  }
  .divider-line {
    border: none;
    border-top: 1px dashed #444;
    margin: 8px 0 4px;
  }
  .divider-label {
    text-align: center;
    font-size: 11px;
    color: #555;
    padding: 2px 0;
  }

  .meta { font-size: 11px; color: #555; padding: 0 4px; }
  .inbound .meta { text-align: left; }
  .outbound .meta { text-align: right; }
  .system .meta { text-align: center; }

  .bubble img { max-width: 240px; max-height: 320px; border-radius: 8px; display: block; margin-top: 4px; }
</style>
</head>
<body>

<div id="header">
  <span><span id="conn-dot"></span><span class="label">channel</span></span>
  <span><span class="label">model </span><span class="value model" id="hdr-model">—</span></span>
  <span><span class="label">session </span><span class="value" id="hdr-session">—</span></span>
  <span class="last-seen" id="hdr-last">no activity yet</span>
</div>

<div id="log"></div>

<script>
const log = document.getElementById('log');
const dot = document.getElementById('conn-dot');
const hdrModel = document.getElementById('hdr-model');
const hdrSession = document.getElementById('hdr-session');
const hdrLast = document.getElementById('hdr-last');

let lastActivity = null;
let activityTimer = null;

function updateLastSeen() {
  if (!lastActivity) return;
  const secs = Math.round((Date.now() - lastActivity) / 1000);
  if (secs < 60) hdrLast.textContent = `last activity ${secs}s ago`;
  else if (secs < 3600) hdrLast.textContent = `last activity ${Math.round(secs/60)}m ago`;
  else hdrLast.textContent = `last activity ${Math.round(secs/3600)}h ago`;
}

function markActivity() {
  lastActivity = Date.now();
  updateLastSeen();
  if (activityTimer) clearInterval(activityTimer);
  activityTimer = setInterval(updateLastSeen, 15000);
}

function ts(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
}

function append(html) {
  log.insertAdjacentHTML('beforeend', html);
  log.scrollTop = log.scrollHeight;
}

function renderEntry(ev) {
  markActivity();
  if (ev.model) hdrModel.textContent = ev.model;
  if (ev.sessionId) hdrSession.textContent = ev.sessionId.slice(0, 8);

  const t = ts(ev.timestamp);

  if (ev.type === 'reset') {
    append(`
      <div class="entry divider">
        <hr class="divider-line">
        <div class="divider-label">⟳ new session — ${t}${ev.model ? ' · ' + ev.model : ''}</div>
      </div>`);
    return;
  }

  if (ev.type === 'slash') {
    append(`
      <div class="entry system">
        <div class="bubble">⚡ ${escHtml(ev.command)}<br><span style="color:#aaa">${escHtml(ev.reply || '')}</span></div>
        <div class="meta">${t}</div>
      </div>`);
    return;
  }

  const dir = ev.type === 'inbound' ? 'inbound' : 'outbound';
  const from = ev.type === 'inbound' ? ev.sender : 'agent';

  let content = '';
  if (ev.text) content += `<span>${escHtml(ev.text)}</span>`;
  if (ev.images && ev.images.length) {
    for (const img of ev.images) {
      const src = `/eavesdrop/media?path=${encodeURIComponent(img.path)}`;
      content += `<img src="${src}" alt="MMS image">`;
    }
  }

  append(`
    <div class="entry ${dir}">
      <div class="bubble">${content}</div>
      <div class="meta">${escHtml(from)} · ${t}</div>
    </div>`);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function connect() {
  const es = new EventSource('/eavesdrop/events');
  dot.className = '';

  es.onopen = () => { dot.className = 'connected'; };

  es.addEventListener('message', e => {
    try { renderEntry(JSON.parse(e.data)); } catch {}
  });

  es.addEventListener('meta', e => {
    try {
      const d = JSON.parse(e.data);
      if (d.model) hdrModel.textContent = d.model;
      if (d.sessionId) hdrSession.textContent = d.sessionId.slice(0, 8);
    } catch {}
  });

  es.onerror = () => {
    dot.className = 'error';
    es.close();
    setTimeout(connect, 3000);
  };
}

connect();
</script>
</body>
</html>
